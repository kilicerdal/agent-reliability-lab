name: Lab verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ['5544:5432']
        options: --health-cmd "pg_isready -U lab -d lab" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LAB_DATABASE_URL: postgresql://lab:lab@127.0.0.1:5544/lab
      LAB_READER_DSN: postgresql://lab_reader:lab_reader@127.0.0.1:5544/lab
      PYTHONPATH: backend
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: pip install -r requirements.lock
      - run: python scripts/check-evidence.py
      - run: python -m backend.reliability.verify
      - name: Regrade the cause-contract comparisons offline
        run: |
          python -m backend.reliability.verify --evidence evidence/cause-contract
          python -m backend.reliability.verify --fixtures backend/reliability/mixed-signals.json --evidence evidence/cause-contract-mixed
          python -m backend.reliability.paired_report --fixtures backend/reliability/blind-cause-fixtures.json --evidence evidence/cause-contract-blind --output "${RUNNER_TEMP}/blind-paired.json"
          cmp "${RUNNER_TEMP}/blind-paired.json" evidence/cause-contract-blind/paired.json
      - run: python -m backend.controls.verify
      - run: python -m backend.reliability.verify_recovery evidence/assurance/live-recovery
      - name: Regrade the citation review comparisons offline
        run: |
          python -m backend.reliability.verify_recovery evidence/assurance/citation-review-fixed-cap
          python -m backend.reliability.verify_recovery evidence/assurance/citation-review-matched-budget
          python -m backend.reliability.verify_paired_citations evidence/assurance/citation-review-paired
      - name: Start synthetic inventory
        run: |
          python -m uvicorn lab.inventory:app --host 127.0.0.1 --port 8811 > /tmp/inventory.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8811/stock && break; sleep 1; done
      - run: ruff check backend && ruff format --check backend
      - name: Verify the independent reviewer kit offline
        run: pytest -q docs/reviewer-kit/test_worked_example.py
      - name: Offline and real database tests — no model calls
        run: pytest -q
      - run: npm --prefix dashboard ci
      - run: npx prettier --check app "!app/showcase/recorded-data.json" scripts/recordings.mjs next.config.ts playwright.config.ts playwright.public.config.ts tests package.json tsconfig.json
        working-directory: dashboard
      - run: npm --prefix dashboard run build
      - name: Start recorded viewer
        run: |
          python -m uvicorn lab.api:app --host 127.0.0.1 --port 8810 > /tmp/api.log 2>&1 &
          npm --prefix dashboard run start > /tmp/dashboard.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3310 > /dev/null && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:browser
        working-directory: dashboard
      - run: npm run build:public && npm run test:public
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            dashboard/artifacts/
            dashboard/test-results/
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for synthetic services
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8811/stock && curl -fsS http://127.0.0.1:8810/health && curl -fsS http://127.0.0.1:3310 > /dev/null && exit 0; sleep 2; done
          exit 1
      - name: Container integration checks — no API key
        run: docker compose run --rm --entrypoint pytest runner -q
      - name: Preserve container diagnostics
        if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
